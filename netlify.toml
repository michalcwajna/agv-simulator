[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy /api/* to Railway backend
[[redirects]]
  from  = "/api/*"
  to    = "https://agv-backend-production.up.railway.app/api/:splat"
  status = 200
  force  = true

# SPA fallback — all routes served by index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
