[build]
  base    = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy /api/* to Railway backend (set BACKEND_URL in Netlify env vars)
[[redirects]]
  from  = "/api/*"
  to    = "${BACKEND_URL}/api/:splat"
  status = 200
  force  = true

# SPA fallback — all routes served by index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
